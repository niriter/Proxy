[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "proxy"
dynamic = ["version"]
description = "Simple universal Proxy module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "proxy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["proxy"]

[tool.hatch.build.targets.sdist]
include = [
    "/proxy",
    "/README.md",
]
